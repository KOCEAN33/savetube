name: test

# Renovate lands an automerged update on develop only after these pass on its
# renovate/ branch.
on:
  push:
    branches: [develop, "renovate/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # The DB-gated tests skip without SAVETUBE_TEST_DATABASE_URL: CI cannot reach pg-dev.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: make lint
      - run: uv run --project backend pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
