name: image

# Development happens on develop. A push to main releases: semantic-release tags the
# next version from the commit messages (releaserc.toml), and the image carries it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two releases at once would compute the same next version.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # GitHub-hosted: the lab runs no self-hosted runner. The cluster pulls the
  # image through Harbor's ghcr.io pull-through cache.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      # The version when this push released one, the full commit sha otherwise.
      tag: ${{ steps.release.outputs.released == 'true' && steps.release.outputs.version || github.sha }}
      # The git ref of the chart that matches the image: the release tag, or the commit.
      revision: ${{ steps.release.outputs.released == 'true' && steps.release.outputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tags and creates the GitHub Release only. A tag pushed with GITHUB_TOKEN
      # starts no workflow, so this job builds the image itself.
      - id: release
        if: github.ref == 'refs/heads/main'
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: releaserc.toml
          commit: false
          tag: true
          push: true
          vcs_release: true
          changelog: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kocean33/savetube
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.released == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.released == 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Points homelab-workloads' prod at the image just pushed and at the chart from the
  # same commit, in one commit, so Argo CD never pairs a chart with an image from
  # another release. Argo CD rolls it out.
  # Pushes as the kocean33-homelab-ci GitHub App, whose token is scoped here to homelab-workloads.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOMELAB_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          repositories: homelab-workloads

      - uses: actions/checkout@v7
        with:
          repository: KOCEAN33/homelab-workloads
          token: ${{ steps.app.outputs.token }}

      - name: Set image.tag and chartRevision
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          TAG: ${{ needs.build.outputs.tag }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          values=savetube/envs/prod.yaml
          sed -i -E "s/^(  tag: ).*/\1${TAG}/" "$values"
          grep -q "^  tag: ${TAG}$" "$values"
          # chartRevision is the line after `- env: prod` in the list generator.
          appset=savetube/appset.yaml
          sed -i -E "/^ *- env: prod$/{n;s/^( *chartRevision: ).*/\1${REVISION}/}" "$appset"
          grep -A1 -E "^ *- env: prod$" "$appset" | grep -qE "^ *chartRevision: ${REVISION}$"
          git diff --quiet && exit 0
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/${BOT}" --jq .id)+${BOT}@users.noreply.github.com"
          git commit -am "chore(savetube): deploy ${TAG::12}"
          # Another repo's deploy can push between our checkout and push. Rebase and retry.
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 2))
            git pull --rebase
          done
          exit 1
