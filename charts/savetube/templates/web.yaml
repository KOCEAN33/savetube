{{- $name := printf "%s-web" (include "savetube.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
---
# Read-only: the Live page shows the recorder Jobs and the worker pods
# (backend/savetube/k8s.py, cluster_pods).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "savetube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "savetube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ $name }}
      {{- include "savetube.podCommon" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "savetube.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["web"]
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9090
          env:
            {{- include "savetube.dbEnv" . | nindent 12 }}
            {{- include "savetube.archiveRootEnv" . | nindent 12 }}
            - name: SAVETUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAVETUBE_SCHEDULER_URL
              value: http://{{ include "savetube.fullname" . }}-scheduler:8082
            - name: SAVETUBE_PUBLIC_URL
              value: {{ required "publicUrl is required" .Values.publicUrl | quote }}
            - name: SAVETUBE_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: SAVETUBE_OIDC_CLIENT_ID
              value: {{ required "oidc.clientId is required" .Values.oidc.clientId | quote }}
            {{- with .Values.oidc.requiredGroup }}
            - name: SAVETUBE_OIDC_REQUIRED_GROUP
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.oidc.clientSecret.existingSecret }}
            - name: SAVETUBE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecret.existingSecret }}
                  key: {{ .Values.oidc.clientSecret.key }}
            {{- end }}
            - name: SAVETUBE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.session.existingSecret }}
                  key: {{ .Values.session.key }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- include "savetube.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "savetube.archiveReadOnlyMount" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        {{- include "savetube.archiveReadOnlyVolume" . | nindent 8 }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "savetube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
