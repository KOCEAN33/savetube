{{- if .Values.httpRoute.enabled }}
# Gateway API defaults are written out in full: Argo CD's diff cannot tell a
# default from a real value, and an omitted one reads OutOfSync forever.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "savetube.fullname" . }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .name }}
      namespace: {{ .namespace }}
    {{- end }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "savetube.fullname" . }}-web
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
