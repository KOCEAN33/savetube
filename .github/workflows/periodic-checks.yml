# Weekly periodic code checks. The tools and the workflow live in KOCEAN33/code-checks,
# and the periodic-checks JSON config beside this workflow sets what this repository scans.
name: periodic-checks
on:
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  periodic-checks:
    uses: KOCEAN33/code-checks/.github/workflows/periodic-checks.yml@v1
    with:
      branch: develop
      pnpm-package-json: frontend/package.json
      setup: pnpm install --dir frontend --frozen-lockfile
