{{- $name := printf "%s-scheduler" (include "savetube.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
---
# Recorder Jobs are made from the CronJob template at runtime (backend/savetube/k8s.py).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
    {{- with .Values.workloadLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # One scheduler, and Recreate so a rollout never runs two: it is also the only
  # role that migrates, so two migrations never race.
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "savetube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "savetube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: {{ $name }}
      {{- include "savetube.podCommon" . | nindent 6 }}
      initContainers:
        - name: migrate
          image: {{ include "savetube.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "savetube.dbEnv" . | nindent 12 }}
          securityContext:
            {{- include "savetube.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- include "savetube.stagingOwner" . | nindent 8 }}
        {{- include "savetube.potProvider" . | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "savetube.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["scheduler"]
          ports:
            - name: metrics
              containerPort: 9090
            - name: health
              containerPort: 8081
            - name: api
              containerPort: 8082
          {{- include "savetube.livenessProbe" . | nindent 10 }}
          env:
            {{- include "savetube.archiveEnv" . | nindent 12 }}
            {{- include "savetube.stagingEnv" . | nindent 12 }}
            - name: SAVETUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAVETUBE_RECORDER_CRONJOB
              value: {{ include "savetube.fullname" . }}-recorder
          securityContext:
            {{- include "savetube.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "savetube.archiveMounts" . | nindent 12 }}
            {{- include "savetube.stagingMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      volumes:
        {{- include "savetube.archiveVolumes" . | nindent 8 }}
        {{- include "savetube.stagingVolume" . | nindent 8 }}
---
# The scheduler's internal API (backend/savetube/scheduler_api.py). Only the
# web calls it. It has no auth, so it stays a ClusterIP Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    {{- include "savetube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  ports:
    - name: api
      port: 8082
      targetPort: api
---
# Only the web reaches the API. The health and metrics ports stay open to
# every source, as without a policy: the kubelet probes the health port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "savetube.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  podSelector:
    matchLabels:
      {{- include "savetube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "savetube.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports:
        - port: api
    - ports:
        - port: health
        - port: metrics
