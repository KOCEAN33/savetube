image:
  repository: ghcr.io/kocean33/savetube
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Old ReplicaSets each Deployment keeps for rollback.
revisionHistoryLimit: 3

# Extra labels on the metadata of every Deployment and the recorder CronJob,
# not on their pods, Services or other objects.
workloadLabels: {}

# The PO token provider runs as a native sidecar beside every yt-dlp container.
# Keep its tag equal to the bgutil-ytdlp-pot-provider plugin version in uv.lock.
potProvider:
  image:
    repository: brainicism/bgutil-ytdlp-pot-provider
    tag: "2.0.2"
  resources: {}

# SAVETUBE_LOG_LEVEL of every role: debug, info, warning or error.
logLevel: info

# The browser-facing origin. Redirect URIs and the cookie's Secure flag come from it.
publicUrl: ""

oidc:
  issuer: https://auth.hiriri.com
  clientId: ""
  # A value of the `groups` claim a user must hold. Empty admits any user the issuer lets through.
  requiredGroup: ""
  # Empty means a public client with PKCE only.
  clientSecret:
    existingSecret: ""
    key: client-secret

session:
  # A Secret holding the key that signs the session cookie.
  existingSecret: savetube-session
  key: secret

database:
  # A Secret holding the libpq URL, e.g.
  # postgres://savetube:<urlquery-escaped password>@postgres-pooler-rw.postgres.svc:5432/savetube
  existingSecret: savetube-db
  key: url

archive:
  # The PVC holding the archive tree and its .incoming/ directory, on one filesystem.
  existingClaim: ""

staging:
  # A PVC on quiet disks where archive downloads work and finished ones wait,
  # mounted by the worker and the scheduler. The scheduler moves them into the
  # archive in batches. Empty downloads into the archive's .incoming/.
  existingClaim: ""

cookies:
  # A Secret whose every key `<name>.txt` is a Netscape cookie file, the cookie
  # profile `<name>`. Empty leaves no profile, so every request runs cookie-free.
  existingSecret: ""

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

web:
  replicas: 1
  resources: {}

worker:
  replicas: 1
  # Hard ceiling on archive downloads per worker pod. The UI's download
  # settings (max_concurrent, 1-10) decide below it.
  concurrency: 10
  # On SIGTERM the worker kills its downloads at once, keeps their parts, and
  # puts their jobs back to waiting, which takes a few seconds. A worker still
  # running at the deadline is killed, and the scheduler's stalled-job reclaim
  # interrupts its jobs about a minute later.
  terminationGracePeriodSeconds: 30
  resources: {}

scheduler:
  resources: {}

recorder:
  # A retry restarts from the first segment while the DVR window holds it.
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  resources: {}

service:
  port: 80

httpRoute:
  enabled: false
  hostnames: []
  # Gateways to attach to, each {name, namespace}.
  parentRefs: []
